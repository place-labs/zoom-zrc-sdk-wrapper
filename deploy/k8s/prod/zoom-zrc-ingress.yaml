# External access to the zoom-zrc API — PRODUCTION. Same convention as
# nonprod (../zoom-zrc-ingress.yaml): ingress-nginx enforces HTTP Basic auth;
# the app itself validates nothing.
#
# Create the auth secret BEFORE applying (use a fresh password — do not reuse
# nonprod's):
#   htpasswd -nB zoomuser > auth
#   kubectl --context <prod> -n placeos \
#     create secret generic zoom-zrc-basic-auth --from-file=auth
#
# Clients (PlaceOS driver basic_auth settings) hit
# https://placeos-prod.avit.it.ucla.edu/zoom/... ; nginx strips the /zoom
# prefix and proxies to the zoom-zrc ClusterIP service on 8000.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: zoom-zrc
  namespace: placeos
  annotations:
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: zoom-zrc-basic-auth
    nginx.ingress.kubernetes.io/auth-realm: Authentication Required
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header X-Original-URI $request_uri;
spec:
  ingressClassName: nginx
  rules:
    - host: placeos-prod.avit.it.ucla.edu
      http:
        paths:
          - path: /zoom(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: zoom-zrc
                port:
                  number: 8000
  tls:
    - hosts:
        - placeos-prod.avit.it.ucla.edu
      secretName: placeos-prod.avit.it.ucla.edu
