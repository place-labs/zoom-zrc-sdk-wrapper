# External access to the zoom-zrc API (nonprod). Exported from the live
# cluster 2026-09-10 (originally created ad hoc via Lens) so the deployment is
# reproducible from this repo.
#
# Auth is enforced HERE, not in the app: ingress-nginx validates HTTP Basic
# credentials against the htpasswd in the zoom-zrc-basic-auth secret. Create it
# with:
#   htpasswd -nB zoomuser > auth
#   kubectl -n placeos create secret generic zoom-zrc-basic-auth --from-file=auth
#
# Clients hit https://<host>/zoom/... ; nginx strips the /zoom prefix
# (rewrite-target) and proxies to the zoom-zrc ClusterIP service on 8000.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: zoom-zrc
  namespace: placeos
  annotations:
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: zoom-zrc-basic-auth
    nginx.ingress.kubernetes.io/auth-realm: Authentication Required
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header X-Original-URI $request_uri;
spec:
  ingressClassName: nginx
  rules:
    - host: placeos-nonprod.avit.it.ucla.edu
      http:
        paths:
          - path: /zoom(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: zoom-zrc
                port:
                  number: 8000
  tls:
    - hosts:
        - placeos-nonprod.avit.it.ucla.edu
      secretName: placeos-nonprod.avit.it.ucla.edu
